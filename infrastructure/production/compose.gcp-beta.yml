# Add after docker-compose.prod.yml and compose.single-host.yml.
# Beta only: private local PostgreSQL/Redis and native private GCS via VM identity.
services:
  gateway:
    image: ${MYAAPTHA_GATEWAY_IMAGE:?Set scanned immutable Nginx image}
    volumes:
      - ./nginx-beta.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/www/acme:ro
    networks:
      default:
        ipv4_address: 172.30.0.2
  frontend:
    mem_limit: 768m
    networks:
      default:
        ipv4_address: 172.30.0.3
  backend:
    mem_limit: 3g
    environment:
      MYAAPTHA_STORAGE_PROVIDER: gcs
      MYAAPTHA_GCS_BUCKET: ${MYAAPTHA_GCS_BUCKET:?Set private Mumbai bucket}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Set beta project}
      MYAAPTHA_HEALTH_AI_ENABLED: 'false'
      MYAAPTHA_CALLS_RELAY_REQUIRED: 'true'
    networks:
      default:
        ipv4_address: 172.30.0.4
  ai-agent:
    mem_limit: 512m
    command: [uvicorn, ai_service.main:app, --app-dir, src, --host, 0.0.0.0, --port, '8081', --no-server-header]
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
