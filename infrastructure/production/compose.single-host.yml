# Budget topology: private database/cache on the same Linux host. No public DB ports.
# Requires issued TLS certificates and immutable image references before deployment.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set immutable PostgreSQL image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myaaptha}
      POSTGRES_USER: ${POSTGRES_USER:-myaaptha}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/etc/postgresql/tls/server.crt, -c, ssl_key_file=/etc/postgresql/tls/server.key]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./certs/postgres-server.crt:/etc/postgresql/tls/server.crt:ro
      - ./certs/postgres-server.key:/etc/postgresql/tls/server.key:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1536m
  redis:
    image: ${REDIS_IMAGE:?Set immutable Redis image digest}
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    secrets:
      - redis_password
    volumes:
      - ./secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./certs/redis-server.crt:/etc/redis/tls/server.crt:ro
      - ./certs/redis-server.key:/etc/redis/tls/server.key:ro
      - ./certs/postgres-ca.crt:/etc/redis/tls/ca.crt:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --tls --cacert /etc/redis/tls/ca.crt -h redis ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m
  backend:
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_SSLMODE: verify-full
      REDIS_TLS: 'true'
      DB_POOL_SIZE: '10'
      SPRING_DATA_REDIS_SSL_BUNDLE: internal
      SPRING_SSL_BUNDLE_PEM_INTERNAL_TRUSTSTORE_CERTIFICATE: file:/etc/myaaptha/redis-ca.crt
    volumes:
      - ./certs/postgres-ca.crt:/etc/myaaptha/redis-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  migrate:
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
  encrypt-fields:
    environment:
      POSTGRES_HOST: postgres
volumes:
  postgres-data: null
