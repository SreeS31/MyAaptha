services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      MYAAPTHA_DOMAIN: ${MYAAPTHA_DOMAIN:?Set MYAAPTHA_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }

  frontend:
    image: ${MYAAPTHA_FRONTEND_IMAGE:?Set frontend image}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]

  backend:
    image: ${MYAAPTHA_BACKEND_IMAGE:?Set backend image}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-myaaptha}
      POSTGRES_USER: ${POSTGRES_USER:-myaaptha}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      MYAAPTHA_STORAGE_PROVIDER: ${MYAAPTHA_STORAGE_PROVIDER:-s3}
      MYAAPTHA_S3_BUCKET: ${MYAAPTHA_S3_BUCKET:-myaaptha-media}
      MYAAPTHA_S3_REGION: ${MYAAPTHA_S3_REGION:-ap-south-1}
      MYAAPTHA_S3_ENDPOINT: ${MYAAPTHA_S3_ENDPOINT:-}
      MYAAPTHA_BASE_URL: http://ai-agent:8081/api/v1
      MYAAPTHA_CORS_ALLOWED_ORIGINS: https://${MYAAPTHA_DOMAIN:?Set MYAAPTHA_DOMAIN}
      MYAAPTHA_NOTIFICATION_WEBHOOK_CHANNEL: ${MYAAPTHA_NOTIFICATION_WEBHOOK_CHANNEL:-}
      MYAAPTHA_NOTIFICATION_WEBHOOK_URL: ${MYAAPTHA_NOTIFICATION_WEBHOOK_URL:-https://sms-provider.invalid/api/messages}
    secrets: [postgres_password, jwt_secret]
    depends_on:
      postgres: { condition: service_healthy }
      ai-agent: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  ai-agent:
    image: ${MYAAPTHA_IMAGE:?Set AI image}
    restart: unless-stopped
    environment:
      AI_ENV: production
      AI_LOG_LEVEL: INFO
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/v1/ready')"]
      interval: 20s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myaaptha}
      POSTGRES_USER: ${POSTGRES_USER:-myaaptha}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myaaptha} -d ${POSTGRES_DB:-myaaptha}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis-data:/data]

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  jwt_secret: { file: ./secrets/jwt_secret }
volumes:
  postgres-data:
  redis-data:
  caddy-data:
