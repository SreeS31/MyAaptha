apiVersion: v1
kind: ConfigMap
metadata:
  name: myaaptha-config
  namespace: myaaptha
data:
  SPRING_PROFILES_ACTIVE: prod
  POSTGRES_HOST: managed-postgres.example.internal
  POSTGRES_DB: myaaptha
  POSTGRES_USER: myaaptha
  MYAAPTHA_STORAGE_PROVIDER: s3
  MYAAPTHA_S3_BUCKET: myaaptha-media
  MYAAPTHA_S3_REGION: ap-south-1
  MYAAPTHA_BASE_URL: http://ai-agent:8081/api/v1
  MYAAPTHA_CORS_ALLOWED_ORIGINS: https://app.example.com
  MYAAPTHA_NOTIFICATION_WEBHOOK_CHANNEL: ''
  MYAAPTHA_NOTIFICATION_WEBHOOK_URL: https://sms-provider.invalid/api/messages
  POSTGRES_SSLMODE: verify-full
  SPRING_FLYWAY_ENABLED: 'false'
  MYAAPTHA_PUBLIC_API_BASE_URL: https://app.example.com
  MYAAPTHA_WEB_ORIGIN: https://app.example.com
  REDIS_HOST: managed-redis.example.internal
  REDIS_PORT: '6379'
  REDIS_TLS: 'true'
  DB_POOL_SIZE: '20'
  DB_POOL_MIN_IDLE: '2'
  TRUSTED_PROXY_REGEX: REPLACE_WITH_PROXY_ADDRESS_REGEX
