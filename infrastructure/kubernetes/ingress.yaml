apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: myaaptha, namespace: myaaptha}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.example.com]
      secretName: myaaptha-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: backend, port: {number: 8080}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 3000}}
