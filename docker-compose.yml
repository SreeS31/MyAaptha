version: "3.9"

services:
  ai-agent:
    build:
      context: ./ai/agent-service
      dockerfile: Dockerfile
    container_name: myaaptha-agent
    environment:
      AI_ENV: local
      AI_SERVICE_NAME: myaaptha-agent
      AI_API_PREFIX: /api/v1
      AI_LOG_LEVEL: INFO
    ports:
      - "8081:8081"

  postgres:
    image: postgres:17-alpine
    container_name: myaaptha-postgres
    environment:
      POSTGRES_DB: myaaptha
      POSTGRES_USER: myaaptha
      POSTGRES_PASSWORD: myaaptha123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myaaptha -d myaaptha"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: myaaptha-redis
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    container_name: myaaptha-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
