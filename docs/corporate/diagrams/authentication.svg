<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-label="Authentication and session lifecycle"><rect width="900" height="610" fill="#f4f7fb"/><text x="40" y="44" font-family="Arial" font-size="23" font-weight="bold" fill="#122843">Authentication and session lifecycle</text><rect x="80" y="75" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="103" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Sign in</text><text x="105" y="127" font-family="Arial" font-size="14" fill="#52657c">Validate identifier/password and any required OTP</text><path d="M450 149v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="175" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="203" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Establish session</text><text x="105" y="227" font-family="Arial" font-size="14" fill="#52657c">Web receives configured cookie session; native receives token response</text><path d="M450 249v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="275" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="303" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Use protected API</text><text x="105" y="327" font-family="Arial" font-size="14" fill="#52657c">Server validates identity, route access and resource scope</text><path d="M450 349v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="375" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="403" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Refresh</text><text x="105" y="427" font-family="Arial" font-size="14" fill="#52657c">Renew through the corresponding session transport</text><path d="M450 449v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="475" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="503" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Revoke or expire</text><text x="105" y="527" font-family="Arial" font-size="14" fill="#52657c">Stop using the session; reauthenticate when refresh is invalid</text></svg>