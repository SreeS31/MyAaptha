<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-label="Message send, read and deletion workflow"><rect width="900" height="610" fill="#f4f7fb"/><text x="40" y="44" font-family="Arial" font-size="23" font-weight="bold" fill="#122843">Message send, read and deletion workflow</text><rect x="80" y="75" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="103" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Authorize conversation</text><text x="105" y="127" font-family="Arial" font-size="14" fill="#52657c">Direct participant or current circle member; posting policy applies</text><path d="M450 149v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="175" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="203" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Send and fetch</text><text x="105" y="227" font-family="Arial" font-size="14" fill="#52657c">Persist message, return authorized history and attachment references</text><path d="M450 249v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="275" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="303" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Read information</text><text x="105" y="327" font-family="Arial" font-size="14" fill="#52657c">Use server read state; group reads reflect conversation fetching</text><path d="M450 349v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="375" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="403" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Private deletion</text><text x="105" y="427" font-family="Arial" font-size="14" fill="#52657c">Delete for me persists only for this account across devices</text><path d="M450 449v22m-5-7 5 7 5-7" stroke="#71839b" fill="none" stroke-width="2"/><rect x="80" y="475" width="740" height="72" rx="12" fill="white" stroke="#2a7182" stroke-width="2"/><text x="105" y="503" font-family="Arial" font-size="18" font-weight="bold" fill="#122843">Global deletion</text><text x="105" y="527" font-family="Arial" font-size="14" fill="#52657c">Direct sender / circle admin; strictly under 24h and not all recipients read</text></svg>