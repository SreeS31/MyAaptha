apiVersion: apps/v1
kind: Deployment
metadata:
  name: myaaptha-backend
  namespace: myaaptha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myaaptha-backend
  template:
    metadata:
      labels:
        app: myaaptha-backend
    spec:
      containers:
        - name: backend
          image: myaaptha-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: myaaptha-secrets
                  key: datasource-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: myaaptha-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: myaaptha-backend
  namespace: myaaptha
spec:
  selector:
    app: myaaptha-backend
  ports:
    - port: 8080
      targetPort: 8080
