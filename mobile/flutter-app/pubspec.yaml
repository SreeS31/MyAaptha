name: myaaptha_mobile
description: MyAaptha mobile application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1
  file_picker: 10.3.10
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  flutter_webrtc: ^1.6.0
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.7
  fast_contacts: ^6.0.0
  # 12.x supports the stable Android SDK 36 toolchain used by this release.
  permission_handler: ^13.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/myaaptha-logo.png
