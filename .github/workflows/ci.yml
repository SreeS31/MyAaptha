name: CI
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Validate repository structure
      run: 'test -f README.md

        test -f docker-compose.yml

        test -f Makefile

        echo "Repository foundation checks passed"

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r infrastructure/requirements.txt
    - run: python -m unittest discover -s infrastructure -p 'test_*.py'
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/spring-boot-app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Configure test Redis authentication
      run: docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass
        38c0839df0b54dca92c43a61b01ea134
      working-directory: .
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Run backend tests
      run: mvn --batch-mode verify
      env:
        REDIS_TEST_HOST: 127.0.0.1
        REDIS_TEST_PORT: '6379'
        REDIS_TEST_PASSWORD: 38c0839df0b54dca92c43a61b01ea134
    - uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/spring-boot-app/target/myaaptha-service-*.jar
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout
          5s --health-retries 10
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nextjs-app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/nextjs-app/package-lock.json
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build frontend
      run: npm run build
    - name: Install browser for end-to-end checks
      run: npx playwright install --with-deps chromium
    - name: Run browser and accessibility checks
      run: npm run test:e2e
      env:
        PLAYWRIGHT_PRODUCTION: '1'
    - name: Message pagination regression tests
      run: npm run test:unit
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify launch-board interactions and live source refresh
      working-directory: .
      run: python infrastructure/verify_launch_board.py
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/agent-service
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: ai/agent-service/requirements.txt
    - name: Install dependencies
      run: python -m pip install -r requirements.txt
    - name: Run AI tests
      run: python -m pytest tests -q
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter-app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.4'
        channel: stable
        cache: true
    - name: Run mobile tests
      run: 'flutter pub get

        flutter analyze

        flutter test

        '
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      if: matrix.context == 'backend/spring-boot-app'
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Populate Maven descriptors for scanning
      if: matrix.context == 'backend/spring-boot-app'
      working-directory: backend/spring-boot-app
      run: mvn --batch-mode dependency:resolve
    - name: Scan repository and container inputs
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ matrix.context }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        exit-code: 1
        scanners: vuln,secret
    - uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif
    strategy:
      matrix:
        context:
        - backend/spring-boot-app
        - frontend/nextjs-app
        - ai/agent-service
  production-smoke:
    needs: backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: .tools
    - name: Validate production profile with disposable TLS PostgreSQL and Redis
      run: python infrastructure/smoke_tls.py .tools/myaaptha-service-0.1.0.jar
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: production-smoke-logs
        path: .tools/smoke
'on':
  workflow_call: null
  workflow_dispatch: {}
  push:
    branches:
    - main
    - develop
    - feature/**
  pull_request:
    branches:
    - main
    - develop
