name: Production Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  security-events: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend/spring-boot-app
          - name: frontend
            context: frontend/nextjs-app
          - name: ai-agent
            context: ai/agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize registry owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/myaaptha-${{ matrix.name }}:${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify container runtime restrictions
        env:
          IMAGE: ghcr.io/${{ steps.registry.outputs.owner }}/myaaptha-${{ matrix.name }}:${{ github.ref_name }}
        run: |
          docker tag "$IMAGE" myaaptha-${{ matrix.name }}:local-validation
          python infrastructure/smoke_images.py --component ${{ matrix.name }}
      - name: Block vulnerable images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.registry.outputs.owner }}/myaaptha-${{ matrix.name }}:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.registry.outputs.owner }}/myaaptha-${{ matrix.name }}:${{ github.ref_name }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.json
      - name: Publish scanned image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ steps.registry.outputs.owner }}/myaaptha-${{ matrix.name }}:${{ github.ref_name }}
        run: |
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" > image-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            sbom-${{ matrix.name }}.json
            image-${{ matrix.name }}.txt
