name: Android signed release candidate
on:
  workflow_dispatch:
    inputs:
      expected_certificate_sha256:
        description: SHA-256 fingerprint of the approved upload certificate
        required: true
        type: string
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded=os.environ.get('KEYSTORE_BASE64','')
          if not encoded: raise SystemExit('Configure the android-release environment signing secrets.')
          key=Path(os.environ['RUNNER_TEMP'])/'myaaptha-upload.p12'
          key.write_bytes(base64.b64decode(encoded,validate=True))
          key.chmod(0o600)
          PY
      - name: Build signed candidate
        working-directory: mobile/flutter-app
        env:
          MYAAPTHA_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/myaaptha-upload.p12
          MYAAPTHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAAPTHA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAAPTHA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release --no-pub
      - name: Verify pinned signing identity and complete signature
        env:
          EXPECTED_CERTIFICATE: ${{ inputs.expected_certificate_sha256 }}
        run: >-
          python infrastructure/verify_android_bundle.py
          mobile/flutter-app/build/app/outputs/bundle/release/app-release.aab
          --expected-certificate-sha256 "$EXPECTED_CERTIFICATE"
          --output android-candidate-verification.json
      - name: Remove private signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/myaaptha-upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-candidate
          retention-days: 7
          path: |
            mobile/flutter-app/build/app/outputs/bundle/release/app-release.aab
            android-candidate-verification.json
