spring:
  application:
    name: myaaptha-api
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/myaaptha?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: myaaptha
    password: myaaptha
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}

server:
  port: 8080
  servlet:
    context-path: /

myaaptha:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSecretKeyInProductionMustBe256BitsMinimum!!}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: myaaptha
  cors:
    allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.myaaptha: INFO
    org.springframework.security: WARN
