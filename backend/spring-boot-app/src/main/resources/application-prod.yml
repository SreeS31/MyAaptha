spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:myaaptha}
    username: ${POSTGRES_USER:myaaptha}
    password: ${POSTGRES_PASSWORD:${postgres_password}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/common
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

security:
  jwt:
    secret: ${JWT_SECRET:${jwt_secret}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: myaaptha-backend

myaaptha:
  rate-limit:
    # Enable only when the load balancer strips client-supplied forwarding headers.
    trust-forwarded-for: ${MYAAPTHA_TRUST_FORWARDED_FOR:false}
    auth-per-minute: ${MYAAPTHA_AUTH_RATE_LIMIT:10}
    api-per-minute: ${MYAAPTHA_API_RATE_LIMIT:300}
  cors:
    allowed-origins: ${MYAAPTHA_CORS_ALLOWED_ORIGINS}
  ai:
    base-url: ${MYAAPTHA_BASE_URL:http://ai-agent:8081/api/v1}
  notifications:
    webhook:
      channel: ${MYAAPTHA_NOTIFICATION_WEBHOOK_CHANNEL:}
      url: ${MYAAPTHA_NOTIFICATION_WEBHOOK_URL:https://sms-provider.invalid/api/messages}
      token: ${MYAAPTHA_NOTIFICATION_WEBHOOK_TOKEN:}
