spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:myaaptha}
    username: ${POSTGRES_USER:myaaptha}
    password: ${POSTGRES_PASSWORD:myaaptha123}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

security:
  jwt:
    secret: ${JWT_SECRET:myaaptha-local-dev-jwt-secret-please-change-2026-strong}
