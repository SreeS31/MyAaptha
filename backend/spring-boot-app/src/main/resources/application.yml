spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    parser:
      strict-duplicate-detection: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:myaaptha}
    username: ${POSTGRES_USER:myaaptha}
    password: ${POSTGRES_PASSWORD:${postgres_password:myaaptha123}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 12MB

spring.servlet.multipart:
  max-file-size: 25MB
  max-request-size: 30MB

myaaptha:
  storage:
    provider: ${MYAAPTHA_STORAGE_PROVIDER:local}
    user-quota-bytes: ${MYAAPTHA_MEDIA_USER_QUOTA_BYTES:1073741824}
    retention-cleanup-cron: ${MYAAPTHA_MEDIA_CLEANUP_CRON:0 30 2 * * *}
    local-directory: ${MYAAPTHA_UPLOAD_DIR:./var/myaaptha/uploads}
    public-base-url: ${MYAAPTHA_MEDIA_BASE_URL:http://localhost:8080}
    s3:
      bucket: ${MYAAPTHA_S3_BUCKET:}
      region: ${MYAAPTHA_S3_REGION:ap-south-1}
      endpoint: ${MYAAPTHA_S3_ENDPOINT:}
  notifications:
    dispatch-delay-ms: ${MYAAPTHA_NOTIFICATION_DISPATCH_MS:5000}
    webhook:
      channel: ${MYAAPTHA_NOTIFICATION_WEBHOOK_CHANNEL:}
      url: ${MYAAPTHA_NOTIFICATION_WEBHOOK_URL:}
      token: ${MYAAPTHA_NOTIFICATION_WEBHOOK_TOKEN:}
  ai:
    base-url: ${MYAAPTHA_BASE_URL:http://localhost:8081/api/v1}
  health-ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  contact-oauth:
    public-api-base-url: ${MYAAPTHA_PUBLIC_API_BASE_URL:http://localhost:8080}
    web-origin: ${MYAAPTHA_WEB_ORIGIN:http://localhost:3000}
    google-client-id: ${GOOGLE_CONTACTS_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CONTACTS_CLIENT_SECRET:}
    microsoft-client-id: ${MICROSOFT_CONTACTS_CLIENT_ID:}
    microsoft-client-secret: ${MICROSOFT_CONTACTS_CLIENT_SECRET:}

security:
  jwt:
    secret: ${JWT_SECRET:${jwt_secret:myaaptha-local-dev-jwt-secret-please-change-2026-strong}}
